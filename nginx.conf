# Web de SEDIN: sitio estático (Next.js export) detrás de Traefik (Dokploy).
# Este archivo se copia a /etc/nginx/conf.d/default.conf, dentro del bloque
# http de nginx: por eso puede llevar el «map» de caché antes del server.
#
# Cabeceras (propuesta, 0.12 y 15.7): un add_header en un location anula TODOS
# los del server, y por eso /assets salía antes sin cabeceras de seguridad.
# Ahora ningún location tiene add_header: la caché se decide con el «map» y
# todas las cabeceras (seguridad + Cache-Control) se declaran una sola vez a
# nivel de server, así que valen para todas las rutas, también para 404.

# Cache-Control por tipo de recurso ($uri ya resuelto: /servicios/ → /servicios/index.html).
map $uri $sedin_cache_control {
    default                         "no-cache";
    ~^/_next/static/                "public, max-age=31536000, immutable";
    ~^/assets/                      "public, max-age=604800";
    ~\.(?:html|txt|xml|json)$       "no-cache";
}

# www.sedinca.com → sedinca.com (301), si Traefik envía aquí el host www.
server {
    listen 80;
    server_name www.sedinca.com;
    return 301 https://sedinca.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Redirecciones relativas (/servicios -> /servicios/) para no perder HTTPS tras Traefik.
    absolute_redirect off;

    # --- Cabeceras de todas las rutas (TLS y redirección a HTTPS: Traefik) ---
    add_header Cache-Control $sedin_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    # HSTS de 1 año, sin includeSubDomains ni preload hasta revisar los subdominios.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- Compresión (incluye los .txt de navegación de Next y el sitemap) ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/javascript
               application/json application/ld+json application/manifest+json image/svg+xml;

    # Recursos con hash (Cache-Control inmutable por el map).
    location /_next/static/ {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Rutas exportadas con barra final (trailingSlash): /servicios -> /servicios/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
